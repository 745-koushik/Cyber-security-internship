<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SSL/TLS Security Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto&display=swap" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
font-family:Roboto;
color:white;
text-align:center;
padding:40px;
}

.container{
background:rgba(0,0,0,0.6);
padding:40px;
border-radius:15px;
width:450px;
margin:auto;
box-shadow:0 0 20px rgba(0,255,255,0.4);
}

h2{
font-family:Orbitron;
color:#00ffff;
margin-bottom:25px;
}

input{
width:80%;
padding:12px;
border:none;
border-radius:8px;
font-size:16px;
margin-bottom:20px;
outline:none;
}

button{
background:#00ffff;
border:none;
padding:12px 25px;
font-size:16px;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#00bfbf;
transform:scale(1.05);
}

.result{
margin-top:25px;
background:#111;
padding:20px;
border-radius:10px;
text-align:left;
font-size:15px;
box-shadow:0 0 10px rgba(0,255,255,0.3);
}

.label{
color:#00ffff;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h2>SSL/TLS Security Scanner</h2>

<input type="text" id="domain" placeholder="Enter domain (example.com)">
<br>
<button onclick="scan()">Scan Website</button>

<div class="result" id="result">
Results will appear here...
</div>

</div>

<script>

function scan(){

let domain=document.getElementById("domain").value;

fetch("http://127.0.0.1:5000/scan",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({domain:domain})
})

.then(response=>response.json())
.then(data=>{

let output="";

for(let key in data){
output+=`<p><span class="label">${key}:</span> ${data[key]}</p>`;
}

document.getElementById("result").innerHTML=output;

});

}

</script>

</body>
</html>
